plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.statusbar.networkicons'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId 'io.github.iammaplezeng.statusbaricons'
        minSdk 28
        targetSdk 34
        versionCode 25
        versionName '0.9.9'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
}
